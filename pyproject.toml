[project]
name = "ffdetails"
version = "0.1.0"
description = "Record Sleeper actuals, Sleeper projections, FantasyPros consensus projections, FantasyPros positional ranks, FantasyPros accuracy, injury tags, and waiver bids."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ffdetails = "ffdetails.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
